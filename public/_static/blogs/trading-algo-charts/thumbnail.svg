<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#0f0f11"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#ffffff" opacity="0.06"/>
  </pattern>
  <rect width="1280" height="720" fill="url(#dots)"/>

  <!-- Background equity curve (decorative) -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M 0,600 L 100,580 L 180,595 L 280,530 L 380,548 L 480,470 L 580,488 L 680,390 L 780,415 L 900,310 L 1050,260 L 1280,180 L 1280,720 L 0,720 Z"
        fill="url(#bgGrad)"/>
  <path d="M 0,600 L 100,580 L 180,595 L 280,530 L 380,548 L 480,470 L 580,488 L 680,390 L 780,415 L 900,310 L 1050,260 L 1280,180"
        fill="none" stroke="#22c55e" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Terracotta accent line -->
  <rect x="100" y="498" width="140" height="3" fill="#b86440" rx="2"/>

  <!-- Main title -->
  <text x="100" y="390" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="58" font-weight="700" fill="#f4f4f5" letter-spacing="-1">Visualising Algo</text>
  <text x="100" y="468" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="58" font-weight="700" fill="#f4f4f5" letter-spacing="-1">Trade Performance</text>

  <!-- Subtitle -->
  <text x="100" y="552" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="22" fill="#71717a" letter-spacing="0">Equity Curve &amp; Distribution Charts · React + Recharts</text>

  <!-- Tag pills -->
  <rect x="100" y="596" width="120" height="32" rx="16" fill="#b86440" fill-opacity="0.15" stroke="#b86440" stroke-width="1" stroke-opacity="0.4"/>
  <text x="160" y="617" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="13" fill="#b86440" text-anchor="middle">Recharts</text>

  <rect x="232" y="596" width="110" height="32" rx="16" fill="#3f3f46" stroke="#52525b" stroke-width="1"/>
  <text x="287" y="617" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="13" fill="#a1a1aa" text-anchor="middle">Next.js</text>

  <rect x="354" y="596" width="120" height="32" rx="16" fill="#3f3f46" stroke="#52525b" stroke-width="1"/>
  <text x="414" y="617" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="13" fill="#a1a1aa" text-anchor="middle">TypeScript</text>

  <!-- Mini chart preview (right side) -->
  <g transform="translate(780, 200)">
    <rect width="400" height="300" rx="16" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <!-- chart header dots -->
    <circle cx="24" cy="24" r="5" fill="#ef4444" fill-opacity="0.7"/>
    <circle cx="40" cy="24" r="5" fill="#eab308" fill-opacity="0.7"/>
    <circle cx="56" cy="24" r="5" fill="#22c55e" fill-opacity="0.7"/>
    <text x="200" y="28" font-family="monospace" font-size="11" fill="#52525b" text-anchor="middle">equity-curve.tsx</text>
    <!-- mini grid -->
    <line x1="40" y1="60" x2="40" y2="255" stroke="#27272a" stroke-width="1"/>
    <line x1="40" y1="255" x2="370" y2="255" stroke="#27272a" stroke-width="1"/>
    <line x1="40" y1="200" x2="370" y2="200" stroke="#27272a" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="40" y1="145" x2="370" y2="145" stroke="#27272a" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="40" y1="90" x2="370" y2="90" stroke="#27272a" stroke-width="1" stroke-dasharray="4 3"/>
    <!-- gradient fill -->
    <defs>
      <linearGradient id="miniGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#22c55e" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="M 40,255 L 80,235 L 130,242 L 175,195 L 215,208 L 255,165 L 295,178 L 335,120 L 370,80 L 370,255 Z"
          fill="url(#miniGrad)"/>
    <path d="M 40,255 L 80,235 L 130,242 L 175,195 L 215,208 L 255,165 L 295,178 L 335,120 L 370,80"
          fill="none" stroke="#22c55e" stroke-width="2"/>
    <!-- y-axis labels -->
    <text x="35" y="259" font-family="monospace" font-size="9" fill="#52525b" text-anchor="end">$0</text>
    <text x="35" y="149" font-family="monospace" font-size="9" fill="#52525b" text-anchor="end">$600</text>
    <text x="35" y="94" font-family="monospace" font-size="9" fill="#52525b" text-anchor="end">$1200</text>
  </g>
</svg>
