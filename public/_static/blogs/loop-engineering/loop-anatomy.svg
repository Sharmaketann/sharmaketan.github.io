<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="1280" height="660">
  <rect width="1280" height="660" fill="#0f0f11"/>

  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L5.5,3 L0,6 Z" fill="#71717a"/>
    </marker>
    <marker id="ok" markerWidth="9" markerHeight="9" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L5.5,3 L0,6 Z" fill="#1fa97a"/>
    </marker>
    <marker id="bad" markerWidth="9" markerHeight="9" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L5.5,3 L0,6 Z" fill="#d9544d"/>
    </marker>
    <marker id="br" markerWidth="9" markerHeight="9" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L5.5,3 L0,6 Z" fill="#c08a3e"/>
    </marker>
  </defs>

  <text x="72" y="58" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="13"
        fill="#71717a" letter-spacing="2">ANATOMY OF ONE LOOP</text>

  <!-- 1. GOAL -->
  <rect x="72" y="96" width="232" height="78" rx="10" fill="#18181b" stroke="#c08a3e" stroke-width="1.5"/>
  <text x="92" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="16" font-weight="600" fill="#f4f4f5">1 · Goal</text>
  <text x="92" y="150" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="12.5"
        fill="#c08a3e">pnpm test</text>
  <text x="92" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="11.5" fill="#71717a">a command, not a sentence</text>

  <path d="M 188 174 L 188 212" stroke="#71717a" stroke-width="1.8" marker-end="url(#g)"/>

  <!-- 2. PROMPT -->
  <rect x="72" y="220" width="232" height="72" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="92" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="16" font-weight="600" fill="#f4f4f5">2 · Prompt</text>
  <text x="92" y="274" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="11.5" fill="#71717a">task + last failure, nothing else</text>

  <path d="M 304 256 L 400 256" stroke="#71717a" stroke-width="1.8" marker-end="url(#g)"/>

  <!-- 3. AGENT -->
  <rect x="408" y="220" width="232" height="72" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="428" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="16" font-weight="600" fill="#f4f4f5">3 · Agent works</text>
  <text x="428" y="274" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="11.5" fill="#71717a">edits files, runs tools</text>

  <path d="M 640 256 L 736 256" stroke="#71717a" stroke-width="1.8" marker-end="url(#g)"/>

  <!-- 4. CRITIC -->
  <rect x="744" y="212" width="252" height="88" rx="10" fill="#18181b" stroke="#c08a3e" stroke-width="1.5"/>
  <text x="764" y="242" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="16" font-weight="600" fill="#f4f4f5">4 · Critic runs the goal</text>
  <text x="764" y="266" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="11.5" fill="#71717a">a separate process, not the agent</text>
  <text x="764" y="286" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="11.5" fill="#71717a">marking its own homework</text>

  <!-- pass branch -->
  <path d="M 996 240 L 1104 240" stroke="#1fa97a" stroke-width="1.8" marker-end="url(#ok)"/>
  <text x="1050" y="230" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11"
        fill="#1fa97a" text-anchor="middle">exit 0</text>
  <rect x="1112" y="214" width="96" height="52" rx="10" fill="#1fa97a" fill-opacity="0.1"
        stroke="#1fa97a" stroke-width="1.5"/>
  <text x="1160" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="14" font-weight="600" fill="#1fa97a" text-anchor="middle">Done</text>

  <!-- fail branch down to budget -->
  <path d="M 870 300 L 870 356" stroke="#d9544d" stroke-width="1.8" marker-end="url(#bad)"/>
  <text x="890" y="332" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11"
        fill="#d9544d">exit 1</text>

  <!-- 5. BUDGET -->
  <rect x="744" y="364" width="252" height="80" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="764" y="394" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="16" font-weight="600" fill="#f4f4f5">5 · Budget left?</text>
  <text x="764" y="418" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="11.5" fill="#71717a">attempts, tokens, wall-clock</text>
  <text x="764" y="436" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="11.5" fill="#71717a">— whichever runs out first</text>

  <!-- budget exhausted -->
  <path d="M 996 404 L 1104 404" stroke="#d9544d" stroke-width="1.8" marker-end="url(#bad)"/>
  <text x="1050" y="394" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11"
        fill="#d9544d" text-anchor="middle">no</text>
  <rect x="1112" y="378" width="120" height="52" rx="10" fill="#d9544d" fill-opacity="0.1"
        stroke="#d9544d" stroke-width="1.5"/>
  <text x="1172" y="403" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="13" font-weight="600" fill="#d9544d" text-anchor="middle">Give up</text>
  <text x="1172" y="420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="10.5" fill="#a1a1aa" text-anchor="middle">loudly</text>

  <!-- feedback edge: budget yes -> back to prompt -->
  <path d="M 744 404 L 188 404 L 188 300" fill="none" stroke="#c08a3e" stroke-width="1.8"
        marker-end="url(#br)"/>
  <text x="470" y="394" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11.5"
        fill="#c08a3e" text-anchor="middle">yes — feed the failure back in and go again</text>

  <!-- footnote band -->
  <rect x="72" y="498" width="1136" height="100" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="96" y="530" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="14" font-weight="600" fill="#f4f4f5">The part people skip</text>
  <text x="96" y="556" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="13" fill="#a1a1aa">Step 4 has to be a real command with a real exit code. If the stop condition is "the agent said it finished",</text>
  <text x="96" y="578" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="13" fill="#a1a1aa">you have not built a loop — you have built a machine for generating confident-sounding claims.</text>
</svg>
