<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 480" width="1280" height="480">
  <!-- Background -->
  <rect width="1280" height="480" fill="#ffffff"/>

  <!-- Chart area: left=100, right=1180, top=60, bottom=420 -->
  <!-- 15 buckets, barWidth=60, gap=12, spacing=72 -->
  <!-- maxCount=6, height per unit = 60 -->

  <!-- Horizontal grid lines -->
  <line x1="100" y1="420" x2="1180" y2="420" stroke="#e5e7eb" stroke-width="1.5"/>
  <line x1="100" y1="360" x2="1180" y2="360" stroke="#f0f0f0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="100" y1="300" x2="1180" y2="300" stroke="#f0f0f0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="100" y1="240" x2="1180" y2="240" stroke="#f0f0f0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="100" y1="180" x2="1180" y2="180" stroke="#f0f0f0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="100" y1="120" x2="1180" y2="120" stroke="#f0f0f0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="100" y1="60"  x2="1180" y2="60"  stroke="#f0f0f0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Y-axis border -->
  <line x1="100" y1="60" x2="100" y2="420" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Zero bucket divider -->
  <line x1="628" y1="60" x2="628" y2="420" stroke="#e5e7eb" stroke-width="1.5" stroke-dasharray="6 3"/>

  <!-- RED BARS (losing trades, i=0..6) -->
  <!-- i=0: x=100, c=1, h=60, y=360 -->
  <rect x="100" y="360" width="60" height="60" rx="3" fill="#ef4444" fill-opacity="0.75"/>
  <!-- i=1: x=172, c=1, h=60, y=360 -->
  <rect x="172" y="360" width="60" height="60" rx="3" fill="#ef4444" fill-opacity="0.75"/>
  <!-- i=2: x=244, c=2, h=120, y=300 -->
  <rect x="244" y="300" width="60" height="120" rx="3" fill="#ef4444" fill-opacity="0.75"/>
  <!-- i=3: x=316, c=3, h=180, y=240 -->
  <rect x="316" y="240" width="60" height="180" rx="3" fill="#ef4444" fill-opacity="0.75"/>
  <!-- i=4: x=388, c=4, h=240, y=180 -->
  <rect x="388" y="180" width="60" height="240" rx="3" fill="#ef4444" fill-opacity="0.75"/>
  <!-- i=5: x=460, c=3, h=180, y=240 -->
  <rect x="460" y="240" width="60" height="180" rx="3" fill="#ef4444" fill-opacity="0.75"/>
  <!-- i=6: x=532, c=2, h=120, y=300 -->
  <rect x="532" y="300" width="60" height="120" rx="3" fill="#ef4444" fill-opacity="0.75"/>

  <!-- GREEN BARS (profitable trades, i=7..14) -->
  <!-- i=7: x=604, c=1, h=60, y=360 (near-zero) -->
  <rect x="604" y="360" width="60" height="60" rx="3" fill="#22c55e" fill-opacity="0.75"/>
  <!-- i=8: x=676, c=3, h=180, y=240 -->
  <rect x="676" y="240" width="60" height="180" rx="3" fill="#22c55e" fill-opacity="0.75"/>
  <!-- i=9: x=748, c=5, h=300, y=120 -->
  <rect x="748" y="120" width="60" height="300" rx="3" fill="#22c55e" fill-opacity="0.75"/>
  <!-- i=10: x=820, c=6, h=360, y=60 — TALLEST -->
  <rect x="820" y="60" width="60" height="360" rx="3" fill="#22c55e" fill-opacity="0.85"/>
  <!-- i=11: x=892, c=5, h=300, y=120 -->
  <rect x="892" y="120" width="60" height="300" rx="3" fill="#22c55e" fill-opacity="0.75"/>
  <!-- i=12: x=964, c=4, h=240, y=180 -->
  <rect x="964" y="180" width="60" height="240" rx="3" fill="#22c55e" fill-opacity="0.75"/>
  <!-- i=13: x=1036, c=2, h=120, y=300 -->
  <rect x="1036" y="300" width="60" height="120" rx="3" fill="#22c55e" fill-opacity="0.75"/>
  <!-- i=14: x=1108, c=1, h=60, y=360 -->
  <rect x="1108" y="360" width="60" height="60" rx="3" fill="#22c55e" fill-opacity="0.75"/>

  <!-- Count labels on tallest bars -->
  <text x="418" y="172" font-family="-apple-system,sans-serif" font-size="11" fill="#ef4444" text-anchor="middle" font-weight="600">4</text>
  <text x="850" y="52"  font-family="-apple-system,sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="600">6</text>
  <text x="778" y="112" font-family="-apple-system,sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="600">5</text>
  <text x="922" y="112" font-family="-apple-system,sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="600">5</text>

  <!-- Y-axis labels (count) -->
  <text x="88" y="424" font-family="-apple-system,sans-serif" font-size="12" fill="#9ca3af" text-anchor="end">0</text>
  <text x="88" y="364" font-family="-apple-system,sans-serif" font-size="12" fill="#9ca3af" text-anchor="end">1</text>
  <text x="88" y="304" font-family="-apple-system,sans-serif" font-size="12" fill="#9ca3af" text-anchor="end">2</text>
  <text x="88" y="244" font-family="-apple-system,sans-serif" font-size="12" fill="#9ca3af" text-anchor="end">3</text>
  <text x="88" y="184" font-family="-apple-system,sans-serif" font-size="12" fill="#9ca3af" text-anchor="end">4</text>
  <text x="88" y="124" font-family="-apple-system,sans-serif" font-size="12" fill="#9ca3af" text-anchor="end">5</text>
  <text x="88" y="64"  font-family="-apple-system,sans-serif" font-size="12" fill="#9ca3af" text-anchor="end">6</text>
  <text x="60" y="240" font-family="-apple-system,sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle"
        transform="rotate(-90 60 240)"># Trades</text>

  <!-- X-axis bucket labels (every other) -->
  <text x="130"  y="445" font-family="-apple-system,sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">-$350</text>
  <text x="274"  y="445" font-family="-apple-system,sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">-$250</text>
  <text x="418"  y="445" font-family="-apple-system,sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">-$150</text>
  <text x="562"  y="445" font-family="-apple-system,sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">-$50</text>
  <text x="634"  y="445" font-family="-apple-system,sans-serif" font-size="11" fill="#374151" text-anchor="middle" font-weight="600">$0</text>
  <text x="706"  y="445" font-family="-apple-system,sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">+$50</text>
  <text x="850"  y="445" font-family="-apple-system,sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">+$150</text>
  <text x="994"  y="445" font-family="-apple-system,sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">+$250</text>
  <text x="1138" y="445" font-family="-apple-system,sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">+$350</text>

  <!-- Chart title -->
  <text x="640" y="28" font-family="-apple-system,sans-serif" font-size="14" font-weight="600" fill="#374151" text-anchor="middle">Trade Distribution — P&amp;L per Trade</text>

  <!-- Legend -->
  <rect x="490" y="460" width="12" height="12" rx="2" fill="#ef4444" fill-opacity="0.75"/>
  <text x="508" y="471" font-family="-apple-system,sans-serif" font-size="12" fill="#6b7280">Losing trades</text>
  <rect x="650" y="460" width="12" height="12" rx="2" fill="#22c55e" fill-opacity="0.75"/>
  <text x="668" y="471" font-family="-apple-system,sans-serif" font-size="12" fill="#6b7280">Profitable trades</text>
</svg>
