<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560">
  <rect width="1280" height="560" fill="#0f0f11"/>

  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L5.5,3 L0,6 Z" fill="#71717a"/>
    </marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L5.5,3 L0,6 Z" fill="#c08a3e"/>
    </marker>
  </defs>

  <!-- divider -->
  <line x1="640" y1="60" x2="640" y2="500" stroke="#27272a" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- ============ LEFT: prompt engineering ============ -->
  <text x="72" y="70" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="13"
        fill="#71717a" letter-spacing="2">PROMPT ENGINEERING</text>
  <text x="72" y="104" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="25" font-weight="600" fill="#f4f4f5">You are inside the loop</text>

  <!-- you -->
  <rect x="72" y="160" width="150" height="70" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="147" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="16" font-weight="600" fill="#f4f4f5" text-anchor="middle">You</text>
  <text x="147" y="215" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="12" fill="#71717a" text-anchor="middle">read + judge + retype</text>

  <!-- agent -->
  <rect x="330" y="160" width="150" height="70" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="405" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="16" font-weight="600" fill="#f4f4f5" text-anchor="middle">Agent</text>
  <text x="405" y="215" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="12" fill="#71717a" text-anchor="middle">does one turn</text>

  <path d="M 222 182 L 322 182" stroke="#71717a" stroke-width="1.8" marker-end="url(#a1)"/>
  <text x="272" y="172" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11"
        fill="#a1a1aa" text-anchor="middle">prompt</text>

  <path d="M 322 210 L 230 210" stroke="#71717a" stroke-width="1.8" marker-end="url(#a1)"/>
  <text x="272" y="228" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11"
        fill="#a1a1aa" text-anchor="middle">output</text>

  <text x="72" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="14" fill="#a1a1aa">Every turn costs you one decision:</text>
  <text x="72" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="14" fill="#71717a">is this good enough, and what do I say next?</text>

  <rect x="72" y="366" width="408" height="98" rx="10" fill="#d9544d" fill-opacity="0.07"
        stroke="#d9544d" stroke-width="1" stroke-opacity="0.3"/>
  <text x="96" y="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="14" font-weight="600" fill="#d9544d">Scales with your attention</text>
  <text x="96" y="426" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="13" fill="#a1a1aa">20 turns = 20 interruptions. Stop watching</text>
  <text x="96" y="446" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="13" fill="#a1a1aa">and the work stops with you.</text>

  <!-- ============ RIGHT: loop engineering ============ -->
  <text x="712" y="70" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="13"
        fill="#c08a3e" letter-spacing="2">LOOP ENGINEERING</text>
  <text x="712" y="104" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="25" font-weight="600" fill="#f4f4f5">You build the loop, once</text>

  <!-- you -->
  <rect x="712" y="160" width="140" height="70" rx="10" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  <text x="782" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="16" font-weight="600" fill="#f4f4f5" text-anchor="middle">You</text>
  <text x="782" y="215" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="12" fill="#71717a" text-anchor="middle">write goal + rules</text>

  <path d="M 852 195 L 922 195" stroke="#c08a3e" stroke-width="1.8" marker-end="url(#a2)"/>

  <!-- loop box containing agent -->
  <rect x="930" y="138" width="278" height="150" rx="12" fill="#c08a3e" fill-opacity="0.06"
        stroke="#c08a3e" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="948" y="162" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11"
        fill="#c08a3e" letter-spacing="1.5">LOOP</text>

  <rect x="958" y="180" width="128" height="58" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.2"/>
  <text x="1022" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="14" font-weight="600" fill="#f4f4f5" text-anchor="middle">Agent</text>
  <text x="1022" y="225" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="11" fill="#71717a" text-anchor="middle">turn after turn</text>

  <path d="M 1098 196 A 36 36 0 1 1 1098 222" fill="none" stroke="#c08a3e" stroke-width="1.8"
        marker-end="url(#a2)"/>
  <text x="1160" y="268" font-family="ui-monospace,'SF Mono',Menlo,monospace" font-size="11"
        fill="#a1a1aa" text-anchor="middle">test · retry · stop</text>

  <text x="712" y="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="14" fill="#a1a1aa">You spend the same judgement once,</text>
  <text x="712" y="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="14" fill="#71717a">then review the outcome instead of every turn.</text>

  <rect x="712" y="366" width="496" height="98" rx="10" fill="#1fa97a" fill-opacity="0.07"
        stroke="#1fa97a" stroke-width="1" stroke-opacity="0.3"/>
  <text x="736" y="400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="14" font-weight="600" fill="#1fa97a">Scales with your rules</text>
  <text x="736" y="426" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="13" fill="#a1a1aa">20 turns cost the same attention as 2. The</text>
  <text x="736" y="446" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="13" fill="#a1a1aa">bottleneck moves from phrasing to proving.</text>
</svg>
